  <style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updatePreview();
    });

    function fillDemoData() {
      document.getElementById('letterSubject').value = "為函告台端於文到七日內出面清償租金並騰空返還房屋事，請查照。";
      document.getElementById('letterContent').value = 
`(一)緣委託人前於民國114年9月20日與台端簽訂租賃契約，租期自同日起至115年9月19日止。
(二)查台端自115年1月起即未依約按月繳納租金，迄今已積欠租金逾二期以上，扣除押租金後仍積欠新台幣八萬五千元整。
(三)特此依民法第440條及土地法第100條之規定，限台端於文到七日內出面清償租金並騰空返還房屋，否則本律師將依法提起遷讓房屋之訴，請台端自重。`;
      updatePreview();
    }

    function getFullFormattedText() {
      const subject = document.getElementById('letterSubject').value.trim();
      const content = document.getElementById('letterContent').value;
      if (!subject) {
        return content;
      }
      return `一、主旨：${subject}\n二、說明：\n${content}`;
    }

    const CHINESE_ROW_NUMS = ['一.', '二.', '三.', '四.', '五.', '六.', '七.', '八.', '九.', '十.'];

    function splitIntoGridPages(paragraphs, charsPerLine = 20, linesPerPage = 10, keepBlankPages = false) {
      const allLines = [];
      for (let para of paragraphs) {
        if (!para.trim()) continue;
        for (let i = 0; i < para.length; i += charsPerLine) {
          allLines.push(para.substring(i, i + charsPerLine));
        }
      }

      const pages = [];
      for (let i = 0; i < allLines.length; i += linesPerPage) {
        pages.push(allLines.slice(i, i + linesPerPage));
      }
      if (pages.length === 0) pages.push([]);

      if (keepBlankPages && pages.length < 10) {
        while (pages.length < 10) {
          pages.push([]);
        }
      }

      return pages;
    }

    function updatePreview() {
      const subject = document.getElementById('letterSubject').value.trim();
      const rawContent = document.getElementById('letterContent').value;
      const paragraphs = [];
      if (subject) {
        paragraphs.push(`一、主旨：${subject}`);
        paragraphs.push("二、說明：");
      }
      for (let p of rawContent.split("\n")) {
        const pTrim = p.trim();
        if (pTrim) paragraphs.push(pTrim);
      }

      const keepBlank = document.getElementById('keepBlankPages').checked;
      const pages = splitIntoGridPages(paragraphs, 20, 10, keepBlank);
      const container = document.getElementById('previewContainer');
      container.innerHTML = '';

      const totalChars = paragraphs.join('').replace(/\s+/g, '').length;
      document.getElementById('charCount').innerText = `總計：${totalChars} 字 ｜ 共 ${pages.length} 頁`;
      document.getElementById('pageIndicator').innerText = `共 ${pages.length} 頁`;

      const sName = escapeHtml(document.getElementById('senderName').value);
      const sAddr = escapeHtml(document.getElementById('senderAddr').value);
      const rName = escapeHtml(document.getElementById('recipientName').value);
      const rAddr = escapeHtml(document.getElementById('recipientAddr').value);
      const cName = escapeHtml(document.getElementById('copyRecipientName').value);
      const cAddr = escapeHtml(document.getElementById('copyRecipientAddr').value);

    async function downloadLetter(format) {
      const fontSizeVal = document.getElementById('fontSizeSelect').value;
      const fontSize = fontSizeVal ? parseFloat(fontSizeVal) : null;

      const payload = {
        sender_name: document.getElementById('senderName').value.trim(),
        sender_addr: document.getElementById('senderAddr').value.trim(),
        recipient_name: document.getElementById('recipientName').value.trim(),
        recipient_addr: document.getElementById('recipientAddr').value.trim(),
        copy_recipient_name: document.getElementById('copyRecipientName').value.trim(),
        copy_recipient_addr: document.getElementById('copyRecipientAddr').value.trim(),
        subject: document.getElementById('letterSubject').value.trim(),
        content: document.getElementById('letterContent').value.trim(),
        font_size: fontSize,
        output_format: format,
        keep_blank_pages: document.getElementById('keepBlankPages').checked
      };

      if (!payload.sender_name || !payload.recipient_name || !payload.content) {
        alert('請填寫寄件人、收件人與信件內文！');
        return;
      }

      // 整理內文段落：若有主旨則依標準組織「一、主旨：」「二、說明：」
      const paragraphs = [];
      if (payload.subject) {
        paragraphs.push(`一、主旨：${payload.subject}`);
        paragraphs.push("二、說明：");
        for (let p of payload.content.split("\n")) {
          const pTrim = p.trim();
          if (pTrim) paragraphs.push(pTrim);
        }
      } else {
        for (let p of payload.content.split("\n")) {
          const pTrim = p.trim();
          if (pTrim) paragraphs.push(pTrim);
        }
      }

      const odtData = {
        sender_name: payload.sender_name,
        sender_addr: payload.sender_addr,
        recipient_name: payload.recipient_name,
        recipient_addr: payload.recipient_addr,
        copy_recipient_name: payload.copy_recipient_name,
        copy_recipient_addr: payload.copy_recipient_addr,
        paragraphs: paragraphs
      };

      // 1. 若選擇 ODT 匯出：完全依據 fill_legal_letter_填入存證信函.py 之官方 ODT 範本封裝
      if (format === 'odt') {
        try {
          const odtBlob = await generateOfficialOdtBlob(odtData, payload.font_size, payload.keep_blank_pages);
          const url = window.URL.createObjectURL(odtBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `存證信函_${payload.recipient_name}.odt`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
          return;
        } catch (e) {
          console.error('ODT 生成失敗：', e);
          alert('ODT 生成失敗: ' + e.message);
        }
      }

      // 2. 若選擇 PDF：
      if (format === 'pdf') {
        // 先嘗試調用本機後端 LibreOffice 轉檔服務
        try {
          const res = await fetch('/api/legal-letter/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const contentType = res.headers.get('content-type') || '';
          if (res.ok && contentType.includes('application/pdf')) {
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `存證信函_${payload.recipient_name}.pdf`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
            return;
          }
        } catch (err) {
          // 本機服務未啟動，處於靜態環境 (如 GitHub Pages)
        }

        // 自動下載官方標準 ODT 檔案
        try {
          const odtBlob = await generateOfficialOdtBlob(odtData, payload.font_size, payload.keep_blank_pages);
          const url = window.URL.createObjectURL(odtBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `存證信函_${payload.recipient_name}.odt`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        } catch (e) {}

        alert('📄【官方標準存證信函文件】\n\n1. 已為您自動下載中華郵政官方範本 ODT 檔案（使用 LibreOffice 開啟即為 100% 官方標準排版，可直接另存為 PDF）。\n2. 同步開啟列印視窗，您亦可直接於印表機選擇「另存為 PDF」存檔。');
        window.print();
        return;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
