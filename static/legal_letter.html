<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郵局存證信函標準排版生成系統 | 司法AI工具交換所</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['"Noto Serif TC"', 'Georgia', 'serif'],
            brand: ['"Cinzel"', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
    }
    .light-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px -2px rgba(15, 23, 42, 0.04);
    }
    /* 郵局存證信函標準格紙 */
    .post-grid-sheet {
      background: #faf8f5;
      color: #1a1a1a;
      box-shadow: 0 8px 25px -4px rgba(0,0,0,0.12);
      border: 2px solid #b91c1c;
      font-family: 'Noto Serif TC', "BiauKai", "DFKai-SB", "標楷體", serif;
    }
    .grid-cell {
      border: 1px dashed #cbd5e1;
      width: 22px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-amber-100 selection:text-amber-900">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-50 bg-white/85 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="/" class="flex items-center space-x-3 group">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-50 to-blue-50 border border-amber-300 flex items-center justify-center text-amber-700 shadow-sm">
            <i data-lucide="scale" class="w-5 h-5"></i>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center space-x-2">
              <span class="font-brand text-lg font-bold tracking-wider text-slate-900">LEXCRAFT</span>
              <span class="text-[10px] px-1.5 py-0.2 rounded bg-amber-100 text-amber-800 border border-amber-200 font-medium">黃耀平律師建置</span>
            </div>
            <span class="text-[10px] tracking-widest text-slate-500 -mt-0.5 font-serif">司法AI工具交換所</span>
          </div>
        </a>
        <span class="text-slate-300">/</span>
        <span class="text-xs text-amber-800 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200 font-medium">
          郵局存證信函排版生成器 (原生引擎)
        </span>
      </div>

      <div class="flex items-center space-x-2">
        <a href="/tools" class="text-xs px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition flex items-center space-x-1 font-medium">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>返回工具市集</span>
        </a>
      </div>
    </div>
  </header>

  <!-- 工作台雙欄結構 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">
    
    <div class="light-card p-4 rounded-2xl mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-amber-200 bg-gradient-to-r from-amber-50/40 to-white">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center shrink-0">
          <i data-lucide="file-text" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-lg font-serif font-bold text-slate-900 flex items-center space-x-2">
            <span>郵局存證信函自動填寫與排版系統</span>
            <span class="text-[11px] font-sans px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-medium">官方200字/頁規範</span>
          </h1>
          <p class="text-xs text-slate-500 mt-0.5">
            完全相容中華郵政標準格式（10行 × 20格），整合本機 Python 範本處理核心，支援 ODT 與 PDF 格式匯出。
          </p>
        </div>
      </div>
      <div class="flex items-center space-x-2 shrink-0">
        <button onclick="fillDemoData()" class="px-3 py-1.5 rounded-lg bg-white hover:bg-slate-50 text-xs text-slate-700 border border-slate-300 shadow-sm transition flex items-center space-x-1 font-medium">
          <i data-lucide="wand-2" class="w-3.5 h-3.5 text-amber-600"></i>
          <span>載入催告範本</span>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- 左欄：輸入欄位 -->
      <div class="lg:col-span-5 space-y-4">
        
        <!-- 當事人資料 -->
        <div class="light-card p-5 rounded-2xl space-y-3.5">
          <h2 class="text-xs font-serif font-bold text-amber-800 uppercase tracking-wider flex items-center space-x-1.5">
            <i data-lucide="users" class="w-4 h-4 text-amber-600"></i>
            <span>發信與收件當事人欄位</span>
          </h2>

          <div class="space-y-2">
            <div class="grid grid-cols-3 gap-2">
              <input type="text" id="senderName" placeholder="寄件人姓名" value="陳大文 律師" class="col-span-1 px-3 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
              <input type="text" id="senderAddr" placeholder="寄件人完整地址" value="臺北市中正區重慶南路一段122號8樓" class="col-span-2 px-3 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
            </div>
            
            <div class="grid grid-cols-3 gap-2">
              <input type="text" id="recipientName" placeholder="收件人姓名" value="林小明" class="col-span-1 px-3 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
              <input type="text" id="recipientAddr" placeholder="收件人完整地址" value="新北市板橋區縣民大道二段7號10樓" class="col-span-2 px-3 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
            </div>

            <div class="grid grid-cols-3 gap-2">
              <input type="text" id="copyRecipientName" placeholder="副本收件人 (選填)" value="宏達股份有限公司" class="col-span-1 px-3 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
              <input type="text" id="copyRecipientAddr" placeholder="副本地址 (選填)" value="臺北市內湖區瑞光路500號" class="col-span-2 px-3 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
            </div>
          </div>
        </div>

        <!-- 信件內文與字級設定 -->
        <div class="light-card p-5 rounded-2xl space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-serif font-bold text-amber-800 uppercase tracking-wider flex items-center space-x-1.5">
              <i data-lucide="edit" class="w-4 h-4 text-amber-600"></i>
              <span>存證信函本文與主旨</span>
            </h2>
            <div class="flex items-center space-x-2 text-xs">
              <span class="text-slate-500 text-[11px] font-medium">字級:</span>
              <select id="fontSizeSelect" onchange="updatePreview()" class="bg-white border border-slate-300 text-amber-800 px-2 py-0.5 rounded text-[11px] font-medium focus:outline-none focus:border-amber-500">
                <option value="16.0" selected>16 pt (清晰易讀)</option>
                <option value="18.0">18 pt (大字級)</option>
              </select>
            </div>
          </div>

          <!-- 主旨 (選填)：有填則自動以 一、主旨： 二、說明： 格式組織 -->
          <div class="space-y-1">
            <div class="flex items-center justify-between">
              <label class="block text-xs font-bold text-slate-700">主旨 (選填)</label>
              <span class="text-[10px] text-amber-800 bg-amber-50 border border-amber-200 px-1.5 py-0.2 rounded font-medium">有填將自動組織「一、主旨：」「二、說明：」</span>
            </div>
            <input 
              type="text" 
              id="letterSubject" 
              oninput="updatePreview()" 
              placeholder="未填則直接排版內文；若有填將自動列為「一、主旨：」" 
              class="w-full px-3 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white"
            >
          </div>

          <div class="space-y-1">
            <label class="block text-xs font-bold text-slate-700">內容 / 說明段落</label>
            <textarea 
              id="letterContent" 
              rows="9" 
              oninput="updatePreview()" 
              placeholder="請輸入存證信函內容...每段換行將自動對齊郵局格線"
              class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-xs sm:text-sm text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white leading-relaxed font-serif"
            >一、緣本律師受當事人陳先生委託，就台端積欠借款事宜依法致函催告。
二、查台端於民國114年5月1日向委託人借貸新台幣一百萬元整，約定應於民國115年3月1日前清償完畢，並簽有借據在案。
三、詎屆清償期後，委託人屢次催討，台端均置之不理。限台端於函到七日內出面清償，逾期將依法提起民事訴訟並聲請強制執行，切勿自誤為禱。</textarea>
          </div>

          <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1">
            <span id="charCount">總計：187 字 ｜ 預估 1 頁</span>
            <label class="flex items-center space-x-1 cursor-pointer">
              <input type="checkbox" id="keepBlankPages" class="rounded border-slate-300 text-amber-600 focus:ring-0">
              <span>保留範本全部 10 頁空白頁</span>
            </label>
          </div>
        </div>

        <!-- 匯出與下載按鈕 -->
        <div class="light-card p-4 rounded-2xl flex items-center justify-between gap-3 border-amber-200 bg-amber-50/30">
          <div class="text-xs text-slate-700">
            <span class="font-bold text-amber-900">準備匯出官方文件</span>
            <p class="text-[11px] text-slate-500">即時產生標準 ODT 與 PDF 格式</p>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="downloadLetter('odt')" class="px-3.5 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold transition flex items-center space-x-1.5 shadow-sm">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>匯出 ODT</span>
            </button>
            <button onclick="downloadLetter('pdf')" class="px-3.5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold transition flex items-center space-x-1.5 shadow-sm">
              <i data-lucide="file-down" class="w-4 h-4"></i>
              <span>匯出 PDF</span>
            </button>
          </div>
        </div>

      </div>

      <!-- 右欄：郵局格線稿紙即時視覺化預覽 -->
      <div class="lg:col-span-7 space-y-4">
        <div class="light-card p-5 rounded-2xl">
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-200">
            <div class="flex items-center space-x-2">
              <i data-lucide="eye" class="w-4 h-4 text-amber-600"></i>
              <span class="text-xs font-serif font-bold text-slate-900">郵局 10 行 × 20 格稿紙排版擬真預覽</span>
            </div>
            <div class="flex items-center space-x-2 text-xs">
              <span class="text-slate-500">目前頁數：</span>
              <span id="pageIndicator" class="px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-bold">第 1 頁 / 共 1 頁</span>
            </div>
          </div>

          <div id="previewContainer" class="space-y-6 max-h-[700px] overflow-y-auto p-2">
            <!-- 動態繪製每頁 10 行 20 格 -->
          </div>
        </div>
      </div>

    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updatePreview();
    });

    function fillDemoData() {
      document.getElementById('letterSubject').value = "為函告台端於文到七日內出面清償租金並騰空返還房屋事，請查照。";
      document.getElementById('letterContent').value = 
`(一)緣委託人前於民國114年9月20日與台端簽訂租賃契約，租期自同日起至115年9月19日止。
(二)查台端自115年1月起即未依約按月繳納租金，迄今已積欠租金逾二期以上，扣除押租金後仍積欠新台幣八萬五千元整。
(三)特此依民法第440條及土地法第100條之規定，限台端於文到七日內出面清償租金並騰空返還房屋，否則本律師將依法提起遷讓房屋之訴，請台端自重。`;
      updatePreview();
    }

    function getFullFormattedText() {
      const subject = document.getElementById('letterSubject').value.trim();
      const content = document.getElementById('letterContent').value;
      if (!subject) {
        return content;
      }
      return `一、主旨：${subject}\n二、說明：\n${content}`;
    }

    function splitIntoGridPages(text, charsPerLine = 20, linesPerPage = 10) {
      const paragraphs = text.split('\n');
      const allLines = [];

      for (let p of paragraphs) {
        if (!p.trim()) {
          allLines.push('');
          continue;
        }
        let current = p;
        while (current.length > 0) {
          allLines.push(current.substring(0, charsPerLine));
          current = current.substring(charsPerLine);
        }
      }

      const pages = [];
      for (let i = 0; i < allLines.length; i += linesPerPage) {
        pages.push(allLines.slice(i, i + linesPerPage));
      }

      return pages.length ? pages : [[]];
    }

    function updatePreview() {
      const formattedText = getFullFormattedText();
      const pages = splitIntoGridPages(formattedText, 20, 10);
      const container = document.getElementById('previewContainer');
      container.innerHTML = '';

      document.getElementById('charCount').innerText = `總計：${formattedText.replace(/\s+/g, '').length} 字 ｜ 預估 ${pages.length} 頁`;
      document.getElementById('pageIndicator').innerText = `共 ${pages.length} 頁`;

      pages.forEach((pageLines, pageIdx) => {
        const pageCard = document.createElement('div');
        pageCard.className = "post-grid-sheet p-6 rounded-lg text-xs leading-none";

        let html = `
          <div class="text-center font-bold text-base text-red-700 tracking-widest pb-2 mb-3 border-b-2 border-red-700">
            中華郵政存證信函用紙 (第 ${pageIdx + 1} 頁)
          </div>
          <div class="mb-3 text-[11px] text-gray-700 grid grid-cols-2 gap-2 pb-2 border-b border-gray-300">
            <div><strong>寄件人：</strong>${escapeHtml(document.getElementById('senderName').value)}</div>
            <div><strong>收件人：</strong>${escapeHtml(document.getElementById('recipientName').value)}</div>
          </div>
          <div class="space-y-1">
        `;

        const selectedPt = parseFloat(document.getElementById('fontSizeSelect')?.value) || 16.0;
        const cellFontSize = selectedPt >= 18 ? '17px' : '15px';
        const cellFontWeight = selectedPt >= 18 ? '600' : '400';

        for (let row = 0; row < 10; row++) {
          const lineStr = pageLines[row] || '';
          html += `<div class="flex items-center space-x-0.5 justify-center">`;
          for (let col = 0; col < 20; col++) {
            const char = lineStr[col] || '';
            html += `<span class="grid-cell" style="font-size: ${cellFontSize}; font-weight: ${cellFontWeight};">${escapeHtml(char)}</span>`;
          }
          html += `</div>`;
        }

        html += `
          </div>
          <div class="mt-4 pt-2 border-t border-gray-300 flex justify-between text-[10px] text-gray-500">
            <span>官方格式規範：每頁10行 每行20格 滿頁200字</span>
            <span>第 ${pageIdx + 1} 頁 / 共 ${pages.length} 頁</span>
          </div>
        `;

        pageCard.innerHTML = html;
        container.appendChild(pageCard);
      });
    }

    async function downloadLetter(format) {
      const payload = {
        sender_name: document.getElementById('senderName').value.trim(),
        sender_addr: document.getElementById('senderAddr').value.trim(),
        recipient_name: document.getElementById('recipientName').value.trim(),
        recipient_addr: document.getElementById('recipientAddr').value.trim(),
        copy_recipient_name: document.getElementById('copyRecipientName').value.trim(),
        copy_recipient_addr: document.getElementById('copyRecipientAddr').value.trim(),
        subject: document.getElementById('letterSubject').value.trim(),
        content: document.getElementById('letterContent').value.trim(),
        font_size: parseFloat(document.getElementById('fontSizeSelect').value),
        output_format: format,
        keep_blank_pages: document.getElementById('keepBlankPages').checked
      };

      if (!payload.sender_name || !payload.recipient_name || !payload.content) {
        alert('請填寫寄件人、收件人與信件內文！');
        return;
      }

      try {
        const res = await fetch('/api/legal-letter/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const err = await res.json();
          alert('生成失敗: ' + (err.detail || '請重試'));
          return;
        }

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `存證信函_${payload.recipient_name}.${format}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      } catch (err) {
        alert('下載失敗: ' + err.message);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
