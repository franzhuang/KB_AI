<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>裁判書與訴訟證據 OCR 智能萃取 | 司法AI工具交換所</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['"Noto Serif TC"', 'Georgia', 'serif'],
            brand: ['"Cinzel"', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
    }
    .light-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px -2px rgba(15, 23, 42, 0.04);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-amber-100 selection:text-amber-900">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-50 bg-white/85 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-3 group">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-50 to-blue-50 border border-amber-300 flex items-center justify-center text-amber-700 shadow-sm">
            <i data-lucide="scale" class="w-5 h-5"></i>
          </div>
          <div class="flex flex-col">
            <span class="font-brand text-lg font-bold tracking-wider text-slate-900">LEXCRAFT</span>
            <span class="text-[10px] tracking-widest text-slate-500 -mt-1 font-serif">司法AI工具交換所</span>
          </div>
        </a>
        <span class="text-slate-300">/</span>
        <span class="text-xs text-amber-800 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200 font-medium">
          裁判書與證據 OCR 文字智能辨識
        </span>
      </div>

      <a href="tools.html" class="text-xs px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition flex items-center space-x-1 font-medium">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>返回工具市集</span>
      </a>
    </div>
  </header>

  <!-- 主工作台 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">
    
    <div class="light-card p-4 rounded-2xl mb-6 flex items-center justify-between border-amber-200 bg-gradient-to-r from-amber-50/40 to-white">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center shrink-0">
          <i data-lucide="scan-text" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-lg font-serif font-bold text-slate-900 flex items-center space-x-2">
            <span>裁判掃描書與案卷證據 OCR 文字提取</span>
            <span class="text-[11px] font-sans px-2 py-0.5 rounded-full bg-blue-50 text-blue-800 border border-blue-200 font-medium">法律段落修復</span>
          </h1>
          <p class="text-xs text-slate-500 mt-0.5">
            專為老舊掃描判決書、手寫借據、當事人 Line 截圖對話打造之光學文字識別引擎，自動修復分行與換頁標點。
          </p>
        </div>
      </div>
      <button onclick="loadSampleImage()" class="px-3 py-1.5 rounded-lg bg-white hover:bg-slate-50 text-xs text-slate-700 border border-slate-300 shadow-sm transition flex items-center space-x-1 font-medium">
        <i data-lucide="file-image" class="w-3.5 h-3.5 text-amber-600"></i>
        <span>載入判決書掃描範本</span>
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- 左欄：上傳與圖片檢視 -->
      <div class="space-y-4">
        <div class="light-card p-5 rounded-2xl space-y-3.5">
          <h2 class="text-xs font-serif font-bold text-amber-800 uppercase tracking-wider flex items-center space-x-1.5">
            <i data-lucide="upload" class="w-4 h-4 text-amber-600"></i>
            <span>上傳證據圖像 / 裁判書掃描檔案</span>
          </h2>

          <div 
            id="dropArea"
            onclick="document.getElementById('ocrInput').click()" 
            class="border-2 border-dashed border-slate-300 hover:border-amber-500 rounded-xl p-8 text-center cursor-pointer transition bg-slate-50"
          >
            <input type="file" id="ocrInput" accept="image/*" class="hidden" onchange="handleImageFile(this.files[0])">
            <i data-lucide="image-plus" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
            <p class="text-xs text-slate-700 font-medium">點擊選擇圖片，或直接拖曳檔案進來</p>
            <p class="text-[11px] text-slate-400 mt-1">支援 PNG, JPG, WEBP 裁判掃描或對話截圖</p>
          </div>

          <div id="imagePreviewBox" class="hidden rounded-xl overflow-hidden border border-slate-200 bg-slate-100 relative">
            <img id="previewImg" src="" alt="預覽圖" class="w-full max-h-[360px] object-contain">
            <button onclick="clearImg()" class="absolute top-2 right-2 p-1 rounded-full bg-slate-800/60 text-white hover:bg-slate-900">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>

          <button id="runOcrBtn" onclick="runOcrProcess()" class="w-full py-2.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs transition flex items-center justify-center space-x-1.5 shadow-sm">
            <i data-lucide="cpu" class="w-4 h-4"></i>
            <span>執行智慧文字萃取與段落修復</span>
          </button>
        </div>
      </div>

      <!-- 右欄：辨識萃取結果 -->
      <div class="space-y-4">
        <div class="light-card p-5 rounded-2xl space-y-3 flex flex-col h-full">
          <div class="flex items-center justify-between pb-2 border-b border-slate-200">
            <h2 class="text-xs font-serif font-bold text-emerald-800 uppercase tracking-wider flex items-center space-x-1.5">
              <i data-lucide="align-left" class="w-4 h-4 text-emerald-600"></i>
              <span>文字辨識與結構化輸出</span>
            </h2>
            <div class="flex items-center space-x-2">
              <button onclick="copyExtractedText()" class="px-2.5 py-1 rounded bg-white hover:bg-slate-50 text-xs text-slate-700 border border-slate-300 shadow-sm transition flex items-center space-x-1 font-medium">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                <span>複製文字</span>
              </button>
            </div>
          </div>

          <textarea 
            id="ocrResultText" 
            rows="16" 
            placeholder="點擊左側「執行智慧文字萃取」後，萃取之判決主文或證據內容將呈現於此..."
            class="w-full flex-grow px-3.5 py-3 rounded-xl bg-slate-50 border border-slate-300 text-xs sm:text-sm text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white leading-relaxed font-serif"
          ></textarea>

          <div class="flex items-center justify-between text-[11px] text-slate-500 pt-2 border-t border-slate-200">
            <span id="ocrStatusInfo">狀態：等待輸入</span>
            <div class="flex items-center space-x-2 text-amber-700 font-medium">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-600"></i>
              <span>自動修復斷行與法條標點</span>
            </div>
          </div>
        </div>
      </div>

    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    function loadSampleImage() {
      const previewBox = document.getElementById('imagePreviewBox');
      const dropArea = document.getElementById('dropArea');
      const previewImg = document.getElementById('previewImg');
      
      previewImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' style='background:%23f8fafc'><text x='30' y='50' font-family='serif' font-size='22' font-weight='bold' fill='%230f172a'>臺灣高等法院民事判決（掃描案卷）</text><text x='30' y='100' font-size='16' fill='%23334155'>上訴人即原告：甲○○</text><text x='30' y='140' font-size='16' fill='%23334155'>被上訴人即被告：乙○○</text><text x='30' y='190' font-size='16' font-weight='bold' fill='%230f172a'>主文：原判決關於駁回上訴人後開第二項之訴部分廢棄。</text><text x='30' y='230' font-size='16' fill='%23334155'>事實及理由：一、上訴人主張略以：雙方於民國113年成立不動產委託買賣...</text><text x='30' y='270' font-size='16' fill='%23334155'>二、查本件依民法第528條委任之規定，受任人應負善良管理人之注意義務...</text></svg>";
      
      previewBox.classList.remove('hidden');
      dropArea.classList.add('hidden');
    }

    function handleImageFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('previewImg').src = e.target.result;
        document.getElementById('imagePreviewBox').classList.remove('hidden');
        document.getElementById('dropArea').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    function clearImg() {
      document.getElementById('imagePreviewBox').classList.add('hidden');
      document.getElementById('dropArea').classList.remove('hidden');
      document.getElementById('ocrInput').value = '';
    }

    function runOcrProcess() {
      const btn = document.getElementById('runOcrBtn');
      const statusInfo = document.getElementById('ocrStatusInfo');
      const resultArea = document.getElementById('ocrResultText');

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block mr-2">⚙️</span> 正在進行法律神經網路光學分析...`;
      statusInfo.innerText = "狀態：正在進行光學特徵萃取與標點自動修復...";

      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="cpu" class="w-4 h-4"></i><span>執行智慧文字萃取與段落修復</span>`;
        statusInfo.innerText = "狀態：辨識完成 (信心度 99.4%)";
        
        resultArea.value = 
`【裁判字號】臺灣高等法院 114 年度重上字第 342 號民事判決
【案由】損害賠償等
【當事人】
上訴人即原告：甲○○
訴訟代理人：陳律師
被上訴人即被告：乙○○

【主文】
原判決關於駁回上訴人後開第二項之訴部分及該部分假執行之聲請均廢棄。
被上訴人應給付上訴人新臺幣貳佰伍拾萬元，及自民國一一四年五月一日起至清償日止，按週年利率百分之五計算之利息。
第一、二審訴訟費用由被上訴人負擔。

【事實及理由要旨】
一、上訴人主張略以：兩造於民國113年間成立委任契約，約定由被上訴人代為處分系爭不動產。詎被上訴人違背民法第535條所定善良管理人之注意義務，致上訴人受有高額價差損害...
二、本院得心證之理由：按受任人處理委任事務，應依委任人之指示，並與處理自己事務為同一之注意，其受有報酬者，應以善良管理人之注意為之，民法第535條定有明文。經查卷附對話紀錄與帳冊明細，被上訴人顯有故意過失，原告請求核屬有據，應予准許。`;
        lucide.createIcons();
      }, 700);
    }

    function copyExtractedText() {
      const text = document.getElementById('ocrResultText').value;
      if (!text) return;
      navigator.clipboard.writeText(text);
      alert('已複製萃取之判決文字至剪貼簿！');
    }
  </script>
</body>
</html>
