<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案卷個資去識別化系統 (De-ID) | 司法AI工具交換所</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['"Noto Serif TC"', 'Georgia', 'serif'],
            brand: ['"Cinzel"', 'serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-slate-100">

  <!-- 統一亮色頂部導覽列 -->
  <header class="h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between shrink-0 shadow-sm">
    <div class="flex items-center space-x-3">
      <a href="index.html" class="flex items-center space-x-2 group">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-50 to-blue-50 border border-amber-300 flex items-center justify-center text-amber-700 shadow-sm">
          <i data-lucide="scale" class="w-4 h-4"></i>
        </div>
        <span class="font-brand text-sm font-bold tracking-wider text-slate-900 hidden sm:inline">LEXCRAFT</span>
      </a>
      <span class="text-slate-300">/</span>
      <div class="flex items-center space-x-2">
        <span class="text-xs font-bold text-slate-900 flex items-center space-x-1.5">
          <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i>
          <span>案卷個資去識別化系統 (De-ID & Re-ID)</span>
        </span>
        <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 hidden md:inline font-medium">
          純前端本地運算・零隱私外洩
        </span>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="reloadFrame()" class="p-1.5 text-slate-500 hover:text-slate-800 rounded-lg hover:bg-slate-100 transition" title="重新載入工具">
        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
      </button>
      <button onclick="toggleFullscreen()" class="p-1.5 text-slate-500 hover:text-slate-800 rounded-lg hover:bg-slate-100 transition" title="全螢幕專注模式">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
      <a href="tools.html" class="text-xs px-3 py-1.5 rounded-lg text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 transition flex items-center space-x-1 font-medium">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>返回市集</span>
      </a>
    </div>
  </header>

  <!-- 嵌入的原生去識別化 Web 應用程式 -->
  <main class="flex-grow w-full h-[calc(100vh-3.5rem)] bg-slate-50 relative">
    <iframe 
      id="deidFrame" 
      src="/embed/de-id" 
      class="w-full h-full border-none"
      title="個資去識別化系統"
    ></iframe>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    function reloadFrame() {
      const f = document.getElementById('deidFrame');
      f.src = f.src;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
