</head>

  <!-- 主內容區：首屏完美垂直置中 (Vertical Centered Hero) -->
  <main class="flex-grow flex flex-col">
    
    <!-- 第一屏：標題與搜尋框（微偏上方黃金視覺中心） -->
    <section class="min-h-[calc(100vh-4rem)] flex flex-col items-center justify-center px-4 sm:px-6 relative py-12">
      
      <!-- 向上微調區塊 -->

        <div class="text-center max-w-2xl mx-auto mb-9">
          <h1 class="text-4xl sm:text-5xl lg:text-6xl font-serif font-bold tracking-tight title-gradient">

        </div>

        <div class="w-full relative z-30">
          
          <!-- 搜尋卡片 -->
          <div class="search-box rounded-2xl p-2 transition-all duration-300 relative">
          
          <!-- 輸入欄 -->

            <div class="text-amber-600 mr-3 flex items-center">
              <i data-lucide="search" class="w-6 h-6"></i>
            </div>
            <input

              id="searchInput"
              placeholder="搜尋AI工具" 
              class="w-full bg-transparent text-slate-900 placeholder-slate-400 text-base sm:text-lg focus:outline-none font-sans"

              id="clearBtn"

                id="modeFastBtn"

                class="px-2.5 py-1 rounded-lg font-medium transition flex items-center space-x-1 text-amber-900 bg-white shadow-sm border border-slate-200 font-semibold"

        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-700 mb-1 font-medium">所屬分類 *</label>
            <select id="toolCategory" required class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">

            <input type="text" id="toolAuthor" required placeholder="例如：王律師 (群義法律事務所)" class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
          </div>
        </div>

          <label class="block text-slate-700 mb-1 font-medium">工具簡介與解決之司法痛點 *</label>
          <textarea id="toolDesc" rows="3" required placeholder="說明本工具之適用情境、使用規則或能為同行省去多少時間..." class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white"></textarea>

        </div>

          <label class="block text-slate-700 mb-1 font-medium">工具型態與連結/程式碼</label>
          <input type="text" id="toolUrl" placeholder="網頁連結、Prompt 模版網址或自訂路徑 (選填)" class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">

          <button type="submit" class="px-5 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-bold transition flex items-center space-x-1.5 shadow-sm">

            <span>確認上傳發布</span>

  <!-- 引入 GitHub Pages 靜態展示引擎相容腳本 -->
  <script src="/static/static-store.js"></script>
  <script src="static-store.js"></script>
  <script>
    let currentSearchMode = 'fast';
    let searchDebounceTimer = null;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadCategories();
      document.addEventListener('click', (e) => {
        const inputArea = document.querySelector('.search-box');
        if (inputArea && !inputArea.contains(e.target)) {
          hideDropdown();
        }
      });
    });

    function setSearchMode(mode) {
      currentSearchMode = mode;
      const fastBtn = document.getElementById('modeFastBtn');
      const aiBtn = document.getElementById('modeAiBtn');
      
      if (mode === 'fast') {
        fastBtn.className = "px-2.5 py-1 rounded-lg font-medium transition flex items-center space-x-1 text-amber-900 bg-white shadow-sm border border-slate-200 font-semibold";
        aiBtn.className = "px-2.5 py-1 rounded-lg font-medium transition flex items-center space-x-1 text-slate-500 hover:text-slate-900";
        document.getElementById('dropdownTitle').innerText = "站內推薦小工具 (同行評分最高置頂)";
      } else {
        aiBtn.className = "px-2.5 py-1 rounded-lg font-medium transition flex items-center space-x-1 text-blue-950 bg-white shadow-sm border border-slate-200 font-semibold";
        fastBtn.className = "px-2.5 py-1 rounded-lg font-medium transition flex items-center space-x-1 text-slate-500 hover:text-slate-900";
        document.getElementById('dropdownTitle').innerText = "司法 AI 語意情境推論與匹配小工具";
      }

      const inputVal = document.getElementById('searchInput').value;
      if (inputVal.trim()) {
        executeSearch(inputVal);
      }
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearBtn').classList.add('hidden');
      hideDropdown();
    }

    function handleSearchInput(val) {
      const clearBtn = document.getElementById('clearBtn');
      if (val.trim()) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
        hideDropdown();
        return;
      }

      clearTimeout(searchDebounceTimer);
      const delay = currentSearchMode === 'fast' ? 30 : 250;
      searchDebounceTimer = setTimeout(() => {
        executeSearch(val);
      }, delay);
    }

    function handleSearchKeydown(event) {
      if (event.key === 'Enter') {
        const val = event.target.value.trim();
        if (val) executeSearch(val);
      }
    }

    async function executeSearch(query) {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&mode=${currentSearchMode}`);
        if (!res.ok) throw new Error("API Unavailable");
        const data = await res.json();
        renderDropdownResults(data);
      } catch (err) {
        // GitHub Pages 純靜態離線演算法備援
        if (typeof staticSearch === 'function') {
          const data = staticSearch(query, currentSearchMode);
          renderDropdownResults(data);
        }
      }
    }

    function renderDropdownResults(data) {
      const dropdown = document.getElementById('searchDropdown');
      const list = document.getElementById('dropdownResultsList');
      const countBadge = document.getElementById('resultsCountBadge');
      const aiBox = document.getElementById('aiInsightBox');
      const aiText = document.getElementById('aiInsightText');

      list.innerHTML = '';
      countBadge.innerText = `${data.results.length} 項符合`;

      if (data.ai_insight) {
        aiBox.classList.remove('hidden');
        aiText.innerText = data.ai_insight;
      } else {
        aiBox.classList.add('hidden');
      }

      if (data.results.length === 0) {
        list.innerHTML = `
          <div class="py-8 text-center text-slate-500">
            <i data-lucide="help-circle" class="w-8 h-8 mx-auto mb-2 text-slate-400"></i>
            <p class="text-sm font-medium">尚無完全符合「${escapeHtml(data.query)}」的小工具</p>
            <p class="text-xs text-slate-400 mt-1">您可以點擊右上角「發布自製工具」，成為該領域首位貢獻者！</p>
          </div>
        `;
      } else {
        data.results.forEach((tool, index) => {
          const stars = '★'.repeat(Math.round(tool.rating)) + '☆'.repeat(5 - Math.round(tool.rating));
          const isTop = index === 0;

          const card = document.createElement('div');
          card.className = `p-3 rounded-xl transition flex flex-col sm:flex-row sm:items-center justify-between gap-3 border ${
            isTop ? 'bg-amber-50/80 border-amber-200 shadow-sm' : 'bg-slate-50/70 hover:bg-slate-100/80 border-slate-200'
          }`;

          card.innerHTML = `
            <div class="flex-grow min-w-0">
              <div class="flex items-center space-x-2 mb-1 flex-wrap">
                <span class="font-bold text-slate-900 text-sm hover:text-amber-800 transition flex items-center space-x-1.5">
                  <span>${escapeHtml(tool.name)}</span>
                  ${isTop ? '<span class="text-[10px] px-1.5 py-0.2 rounded bg-amber-600 text-white font-bold uppercase">最高分推薦</span>' : ''}
                </span>
                <span class="text-[11px] text-amber-600 font-serif flex items-center space-x-1">
                  <span>${stars}</span>
                  <span class="font-bold">${tool.rating.toFixed(2)}</span>
                  <span class="text-slate-400">(${tool.rating_count} 評)</span>
                </span>
              </div>
              <p class="text-xs text-slate-600 line-clamp-1 mb-1.5">${escapeHtml(tool.description)}</p>
              <div class="flex items-center space-x-2 text-[11px] text-slate-500">
                <span class="text-slate-600 flex items-center space-x-1 font-medium">
                  <i data-lucide="user" class="w-3 h-3 text-slate-400"></i>
                  <span>${escapeHtml(tool.author)}</span>
                </span>
                <span>•</span>
                <span class="px-1.5 py-0.5 rounded bg-white border border-slate-200 text-slate-600">${escapeHtml(tool.category_name)}</span>
              </div>
            </div>
            <div class="flex items-center space-x-2 shrink-0 pt-2 sm:pt-0">
              <a 
                href="${tool.url}" 
                class="px-3 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold transition flex items-center space-x-1 shadow-sm"
              >
                <span>立即開啟</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          `;
          list.appendChild(card);
        });
      }

      dropdown.classList.remove('hidden');
      lucide.createIcons();
    }

    function hideDropdown() {
      const dropdown = document.getElementById('searchDropdown');
      if (dropdown) dropdown.classList.add('hidden');
    }

    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        if (!res.ok) throw new Error("API Unavailable");
        const categories = await res.json();
        renderCategoriesList(categories);
      } catch (err) {
        if (typeof STATIC_DB !== 'undefined') {
          renderCategoriesList(STATIC_DB.categories);
        }
      }
    }

    function renderCategoriesList(categories) {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = '';
      categories.forEach(cat => {
        const card = document.createElement('a');
        card.href = `tools.html?category=${cat.id}`;
        card.className = "group light-card p-4 rounded-xl hover:border-amber-400 hover:shadow-md transition-all duration-200 flex items-center justify-between";
        
        card.innerHTML = `
          <div class="flex items-center space-x-3.5 min-w-0">
            <div class="w-10 h-10 rounded-lg bg-amber-50 border border-amber-200 text-amber-700 flex items-center justify-center shrink-0 group-hover:scale-105 group-hover:bg-amber-100 transition">
              <i data-lucide="${cat.icon || 'folder'}" class="w-5 h-5"></i>
            </div>
            <div class="min-w-0">
              <h3 class="text-sm sm:text-base font-serif font-bold text-slate-900 group-hover:text-amber-800 transition truncate">
                ${escapeHtml(cat.name)}
              </h3>
              <span class="text-[11px] text-slate-400 font-sans">
                ${cat.count} 款小工具
              </span>
            </div>
          </div>
          <div class="w-7 h-7 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 group-hover:text-amber-700 group-hover:bg-amber-50 transition shrink-0 ml-2">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    function openUploadModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
    }
    function closeUploadModal() {
      document.getElementById('uploadModal').classList.add('hidden');
    }

    async function handleUploadSubmit(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('toolName').value.trim(),
        category_id: document.getElementById('toolCategory').value,
        author: document.getElementById('toolAuthor').value.trim(),
        description: document.getElementById('toolDesc').value.trim(),
        tags: document.getElementById('toolTags').value.split(',').map(s => s.trim()).filter(Boolean),
        url: document.getElementById('toolUrl').value.trim() || 'tools.html',
        tool_type: 'web'
      };

      try {
        const res = await fetch('/api/tools', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alert('🎉 恭喜！工具已成功發布至市集，同行已可立即搜尋並進行星級評分！');
          closeUploadModal();
          document.getElementById('uploadToolForm').reset();
          loadCategories();
        } else {
          throw new Error('API Unavailable');
        }
      } catch (err) {
        // GitHub Pages 純前端展示模式模擬發布
        if (typeof STATIC_DB !== 'undefined') {
          const catMap = {
            'doc-drafting': '文書撰擬與函件格式',
            'privacy-evidence': '案卷隱私與證據處置',
            'timeline-schedule': '程序管轄與時限排程',
            'case-research': '判決檢索與實務爭點',
            'contract-review': '契約審查與法規遵循',
            'cost-calc': '費用試算與執行工具'
          };
          const mockTool = {
            id: 'tool-mock-' + Date.now(),
            name: payload.name,
            category_id: payload.category_id,
            category_name: catMap[payload.category_id] || '自訂工具',
            author: payload.author,
            author_title: '認證律師',
            description: payload.description,
            tags: payload.tags,
            rating: 5.0,
            rating_count: 1,
            url: payload.url,
            is_integrated: false
          };
          STATIC_DB.tools.unshift(mockTool);
          alert('🎉【GitHub Pages 展示模式】工具已在當前前端畫面模擬發布！您可以立即在搜尋框輸入名稱測試即時檢索。');
          closeUploadModal();
          document.getElementById('uploadToolForm').reset();
          loadCategories();
        }
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
