<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 工具市集與創作分類庫 | 司法AI工具交換所</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['"Noto Serif TC"', 'Georgia', 'serif'],
            brand: ['"Cinzel"', 'serif'],
          }

      }
    }
  </script>
  <style>

      background-color: #f8fafc;

    }
    .light-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;

    }
    .light-card:hover {
      box-shadow: 0 8px 20px -3px rgba(15, 23, 42, 0.08);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-amber-100 selection:text-amber-900">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-50 bg-white/85 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3 group">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-50 to-blue-50 border border-amber-300 flex items-center justify-center text-amber-700 shadow-sm">
          <i data-lucide="scale" class="w-5 h-5"></i>
        </div>
        <div class="flex flex-col">
          <div class="flex items-center space-x-2">
            <span class="font-brand text-lg font-bold tracking-wider text-slate-900">LEXCRAFT</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded bg-amber-100 text-amber-800 border border-amber-200 font-medium">黃耀平律師建置</span>
          </div>
          <span class="text-[10px] tracking-widest text-slate-500 -mt-0.5 font-serif">司法AI工具交換所</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center space-x-2 text-sm font-medium text-slate-600">
        <a href="index.html" class="px-3 py-1.5 rounded-lg hover:text-slate-900 hover:bg-slate-100 transition flex items-center space-x-1.5">
          <i data-lucide="compass" class="w-4 h-4"></i>
          <span>首頁總覽</span>
        </a>
        <a href="tools.html" class="px-3 py-1.5 rounded-lg text-amber-800 bg-amber-50 border border-amber-200 flex items-center space-x-1.5 font-semibold">
          <i data-lucide="layout-grid" class="w-4 h-4 text-amber-600"></i>
          <span>AI 工具市集</span>
        </a>
        <a href="chat.html" class="px-3 py-1.5 rounded-lg hover:text-slate-900 hover:bg-slate-100 transition flex items-center space-x-1.5">
          <i data-lucide="messages-square" class="w-4 h-4 text-emerald-600"></i>
          <span>司法交流室</span>
        </a>
        <a href="bulletin.html" class="px-3 py-1.5 rounded-lg hover:text-slate-900 hover:bg-slate-100 transition flex items-center space-x-1.5">
          <i data-lucide="bell" class="w-4 h-4 text-purple-600"></i>
          <span>司法公告欄</span>
        </a>
      </nav>

      <button onclick="openUploadModal()" class="inline-flex items-center space-x-1.5 px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-amber-600 hover:bg-amber-700 text-white shadow-sm transition">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>發布自製工具</span>
      </button>
    </div>
  </header>

  <!-- 主體：市集分門別類與工具列表 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    
    <!-- 頂部控制列 -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl sm:text-3xl font-serif font-bold text-slate-900 flex items-center space-x-2">
          <span>AI 工具創作交流市集</span>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-amber-50 border border-amber-200 text-amber-800 font-sans font-medium">同行同儕互評</span>
        </h1>
        <p class="text-slate-500 text-xs sm:text-sm mt-1">
          探索由司法實務同行自製的高效工具，預設依據同行星級評分高低排列。亦可上傳分享您的作品。
        </p>
      </div>

      <!-- 排序控制 -->
      <div class="flex items-center space-x-3 shrink-0">
        <div class="flex items-center bg-white rounded-xl p-1 border border-slate-200 text-xs shadow-sm">
          <span class="px-2 text-slate-500 font-medium">排序：</span>
          <button id="sortRatingBtn" onclick="setSort('rating')" class="px-2.5 py-1 rounded-lg text-amber-900 bg-amber-50 border border-amber-200 font-bold transition">
            ★ 評分最高
          </button>
          <button id="sortNewestBtn" onclick="setSort('newest')" class="px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition">
            最新上架
          </button>
          <button id="sortHotBtn" onclick="setSort('hot')" class="px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition">
            最多評分
          </button>
        </div>
      </div>
    </div>

    <!-- 雙欄佈局：左側分類，右側工具 -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      
      <!-- 左側分類導覽 -->
      <div class="lg:col-span-1 space-y-2">
        <div class="text-xs font-serif font-bold tracking-wider text-slate-500 uppercase px-3 py-1 flex items-center justify-between">
          <span>司法實務分門別類</span>
          <button onclick="selectCategory('all')" class="text-amber-700 text-[11px] hover:underline font-semibold">全部</button>
        </div>

        <div id="categorySidebarList" class="space-y-1">
          <!-- 動態載入分類項目 -->
        </div>

        <!-- 上傳提示卡片 -->
        <div class="p-4 rounded-xl light-card border-amber-200 mt-6 bg-gradient-to-br from-amber-50/60 to-white">
          <div class="flex items-center space-x-2 text-amber-800 mb-1 text-xs font-bold font-serif">
            <i data-lucide="lightbulb" class="w-4 h-4 text-amber-600"></i>
            <span>有自己打造的實用小工具？</span>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed mb-3">
            不論是 Python 腳本、ODT 範本、Excel 試算或 Prompt 模板，歡迎上傳交流！
          </p>
          <button onclick="openUploadModal()" class="w-full py-1.5 px-3 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-xs font-medium transition flex items-center justify-center space-x-1.5 shadow-sm">
            <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i>
            <span>＋ 上傳我開發的工具</span>
          </button>
        </div>
      </div>

      <!-- 右側工具網格 -->
      <div class="lg:col-span-3">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-200">
          <span id="currentCategoryTitle" class="text-base font-serif font-bold text-slate-900">所有分類工具</span>
          <span id="toolsCountInfo" class="text-xs text-slate-500">載入中...</span>
        </div>

        <div id="toolsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- 動態注入工具卡片 -->
        </div>
      </div>

    </div>

  </main>

  <!-- 評價與評論彈窗 (Review Modal) -->
  <div id="reviewModal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xl rounded-2xl border border-slate-200 shadow-2xl p-6 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeReviewModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div class="mb-4">
        <span class="text-xs px-2 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-200 font-medium" id="reviewModalCategory">分類</span>
        <h3 class="text-lg font-serif font-bold text-slate-900 mt-1" id="reviewModalToolName">工具名稱</h3>
        <p class="text-xs text-slate-500 mt-1" id="reviewModalToolDesc">說明</p>
      </div>

      <!-- 新增評分與評價區塊 -->
      <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 mb-6">
        <h4 class="text-xs font-serif font-bold text-amber-800 mb-2 flex items-center space-x-1.5">
          <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
          <span>發表同行使用心得與評分</span>
        </h4>
        <form onsubmit="handleReviewSubmit(event)" class="space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] text-slate-600 mb-1 font-medium">您的姓名與所屬單位 *</label>
              <input type="text" id="reviewerName" required placeholder="例如：李律師 (台中公會)" class="w-full px-2.5 py-1.5 rounded-lg bg-white border border-slate-300 text-xs text-slate-900 focus:outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="block text-[11px] text-slate-600 mb-1 font-medium">推薦星級 (1~5 星) *</label>
              <select id="reviewRating" class="w-full px-2.5 py-1.5 rounded-lg bg-white border border-slate-300 text-xs text-amber-700 font-bold focus:outline-none focus:border-amber-500">
                <option value="5">★★★★★ 5 星 (強烈推薦同行使用)</option>
                <option value="4">★★★★☆ 4 星 (相當實用滿意)</option>
                <option value="3">★★★☆☆ 3 星 (普通，部分功能待加強)</option>
                <option value="2">★★☆☆☆ 2 星 (尚需大幅修正)</option>
                <option value="1">★☆☆☆☆ 1 星 (不符合實務規範)</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-[11px] text-slate-600 mb-1 font-medium">評語心得 / 實務建議 *</label>
            <textarea id="reviewContent" rows="2" required placeholder="寫下您在辦案中的使用體會或格式反饋..." class="w-full px-2.5 py-1.5 rounded-lg bg-white border border-slate-300 text-xs text-slate-900 focus:outline-none focus:border-amber-500"></textarea>
          </div>
          <button type="submit" class="w-full py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs transition shadow-sm">
            送出同行評分
          </button>
        </form>
      </div>

      <!-- 既有評價清單 -->
      <div>
        <h4 class="text-xs font-serif font-bold text-slate-800 mb-3 flex items-center space-x-1.5">
          <i data-lucide="message-circle" class="w-3.5 h-3.5 text-amber-600"></i>
          <span>歷史同行評價列表</span>
        </h4>
        <div id="reviewsListContainer" class="space-y-2">
          <!-- 動態載入評價 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 上傳工具彈窗 Modal -->
  <div id="uploadModal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xl rounded-2xl border border-slate-200 shadow-2xl p-6 relative">
      <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div class="flex items-center space-x-2 text-amber-700 mb-4">
        <i data-lucide="sparkles" class="w-5 h-5 text-amber-600"></i>
        <h3 class="text-lg font-serif font-bold text-slate-900">上傳我的司法 AI 工具</h3>
      </div>
      <form id="uploadToolForm" onsubmit="handleUploadSubmit(event)" class="space-y-4 text-xs sm:text-sm">
        <div>
          <label class="block text-slate-700 mb-1 font-medium">工具名稱 *</label>
          <input type="text" id="toolName" required placeholder="例如：民事再抗告在途期間精算器" class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-700 mb-1 font-medium">所屬分類 *</label>
            <select id="toolCategory" required class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
              <option value="doc-drafting">文書撰擬與函件格式</option>
              <option value="privacy-evidence">案卷隱私與證據處置</option>
              <option value="timeline-schedule">程序管轄與時限排程</option>
              <option value="case-research">判決檢索與實務爭點</option>
              <option value="contract-review">契約審查與法規遵循</option>
              <option value="cost-calc">費用試算與執行工具</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-700 mb-1 font-medium">作者 / 事務所 *</label>
            <input type="text" id="toolAuthor" required placeholder="例如：王律師 (群義法律事務所)" class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
          </div>
        </div>
        <div>
          <label class="block text-slate-700 mb-1 font-medium">工具簡介與解決之司法痛點 *</label>
          <textarea id="toolDesc" rows="3" required placeholder="說明本工具之適用情境、使用規則或能為同行省去多少時間..." class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white"></textarea>
        </div>
        <div>
          <label class="block text-slate-700 mb-1 font-medium">功能標籤 (以逗號分開)</label>
          <input type="text" id="toolTags" placeholder="例如：在途期間, 訴訟法, 抗告, 時效" class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
        </div>
        <div>
          <label class="block text-slate-700 mb-1 font-medium">工具網址 / 外部連結 (選填)</label>
          <input type="text" id="toolUrl" placeholder="若已有網址可直接填寫，留空則自動生成專屬卡片" class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-slate-900 focus:outline-none focus:border-amber-500 focus:bg-white">
        </div>
        <div class="pt-2 flex items-center justify-end space-x-3">
          <button type="button" onclick="closeUploadModal()" class="px-4 py-2 rounded-lg text-slate-500 hover:text-slate-800 transition">取消</button>
          <button type="submit" class="px-5 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-bold transition flex items-center space-x-1.5 shadow-sm">
            <i data-lucide="check" class="w-4 h-4"></i>
            <span>確認發布</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 引入 GitHub Pages 靜態展示引擎相容腳本 -->
  <script src="static-store.js"></script>
  <script>
    let currentCategory = 'all';
    let currentSort = 'rating';
    let categoriesData = [];
    let activeReviewToolId = null;

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const catParam = params.get('category');
      if (catParam) currentCategory = catParam;
      lucide.createIcons();
      loadCategories();
      loadTools();
    });

    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        if (!res.ok) throw new Error("API Unavailable");
        categoriesData = await res.json();
        renderSidebarCategories();
      } catch (err) {
        if (typeof STATIC_DB !== 'undefined') {
          categoriesData = STATIC_DB.categories;
          renderSidebarCategories();
        }
      }
    }

    function renderSidebarCategories() {
      const sidebar = document.getElementById('categorySidebarList');
      sidebar.innerHTML = `
        <button onclick="selectCategory('all')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-medium transition flex items-center justify-between ${
          currentCategory === 'all' ? 'bg-amber-50 border border-amber-200 text-amber-900 font-bold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
        }">
          <span class="flex items-center space-x-2">
            <i data-lucide="layout" class="w-4 h-4"></i>
            <span>全部工具總覽</span>
          </span>
        </button>
      `;

      categoriesData.forEach(c => {
        const isActive = currentCategory === c.id;
        const btn = document.createElement('button');
        btn.onclick = () => selectCategory(c.id);
        btn.className = `w-full text-left px-3 py-2 rounded-xl text-xs font-medium transition flex items-center justify-between ${
          isActive ? 'bg-amber-50 border border-amber-200 text-amber-900 font-bold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
        }`;
        btn.innerHTML = `
          <span class="flex items-center space-x-2">
            <i data-lucide="${c.icon || 'folder'}" class="w-4 h-4"></i>
            <span>${escapeHtml(c.name)}</span>
          </span>
          <span class="text-[10px] px-1.5 py-0.5 rounded-full ${isActive ? 'bg-amber-200 text-amber-900' : 'bg-slate-100 text-slate-500'} font-semibold">${c.count}</span>
        `;
        sidebar.appendChild(btn);
      });

      lucide.createIcons();
    }

    function selectCategory(catId) {
      currentCategory = catId;
      renderSidebarCategories();
      loadTools();
      const url = new URL(window.location);
      if (catId === 'all') url.searchParams.delete('category');
      else url.searchParams.set('category', catId);
      window.history.pushState({}, '', url);
    }

    function setSort(sortType) {
      currentSort = sortType;
      const rBtn = document.getElementById('sortRatingBtn');
      const nBtn = document.getElementById('sortNewestBtn');
      const hBtn = document.getElementById('sortHotBtn');
      
      [rBtn, nBtn, hBtn].forEach(b => {
        b.className = "px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition";
      });

      if (sortType === 'rating') {
        rBtn.className = "px-2.5 py-1 rounded-lg text-amber-900 bg-amber-50 border border-amber-200 font-bold transition";
      } else if (sortType === 'newest') {
        nBtn.className = "px-2.5 py-1 rounded-lg text-amber-900 bg-amber-50 border border-amber-200 font-bold transition";
      } else {
        hBtn.className = "px-2.5 py-1 rounded-lg text-amber-900 bg-amber-50 border border-amber-200 font-bold transition";
      }

      loadTools();
    }

    async function loadTools() {
      try {
        let endpoint = `/api/tools?sort=${currentSort}`;
        if (currentCategory !== 'all') {
          endpoint += `&category=${currentCategory}`;
        }

        const res = await fetch(endpoint);
        if (!res.ok) throw new Error("API Unavailable");
        const tools = await res.json();
        renderToolsGrid(tools);
      } catch (err) {
        if (typeof STATIC_DB !== 'undefined') {
          let tools = [...STATIC_DB.tools];
          if (currentCategory !== 'all') {
            tools = tools.filter(t => t.category_id === currentCategory);
          }
          if (currentSort === 'rating') {
            tools.sort((a, b) => b.rating - a.rating);
          } else if (currentSort === 'newest') {
            tools.sort((a, b) => b.created_at.localeCompare(a.created_at));
          } else {
            tools.sort((a, b) => b.rating_count - a.rating_count);
          }
          renderToolsGrid(tools);
        }
      }
    }

    function renderToolsGrid(tools) {
      const grid = document.getElementById('toolsGrid');
      grid.innerHTML = '';
      
      const currentCatObj = categoriesData.find(c => c.id === currentCategory);
      document.getElementById('currentCategoryTitle').innerText = currentCatObj ? currentCatObj.name : '全部司法工具';
      document.getElementById('toolsCountInfo').innerText = `共計 ${tools.length} 款小工具 (評分高者置頂)`;

        if (tools.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full py-16 text-center text-slate-500 light-card rounded-2xl">
              <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
              <p class="text-sm font-medium">此分類目前尚無小工具</p>
              <button onclick="openUploadModal()" class="mt-3 px-4 py-1.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-200 text-xs font-semibold hover:bg-amber-100 transition">
                成為首位上傳作者
              </button>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        tools.forEach((tool, index) => {
          const stars = '★'.repeat(Math.round(tool.rating)) + '☆'.repeat(5 - Math.round(tool.rating));
          const isTop = index === 0;

          const card = document.createElement('div');
          card.className = `light-card p-5 rounded-2xl border transition-all duration-300 flex flex-col justify-between group ${
            isTop ? 'border-amber-300 bg-amber-50/20' : 'hover:border-amber-300'
          }`;

          card.innerHTML = `
            <div>
              <div class="flex items-start justify-between gap-2 mb-2">
                <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200 font-sans font-medium">
                  ${escapeHtml(tool.category_name)}
                </span>
                <button 
                  onclick="openReviewModal('${tool.id}')"
                  class="flex items-center space-x-1 text-xs text-amber-700 bg-amber-50 hover:bg-amber-100 px-2 py-0.5 rounded-lg border border-amber-200 transition cursor-pointer"
                  title="點擊查看詳細評論或評分"
                >
                  <span class="font-serif">${stars}</span>
                  <span class="font-bold">${tool.rating.toFixed(2)}</span>
                  <span class="text-[10px] text-slate-500">(${tool.rating_count}評)</span>
                </button>
              </div>

              <h3 class="text-base font-serif font-bold text-slate-900 group-hover:text-amber-800 transition mt-1">
                ${escapeHtml(tool.name)}
              </h3>
              
              <div class="flex items-center space-x-1.5 text-xs text-slate-500 mt-1 mb-2.5">
                <i data-lucide="user-check" class="w-3.5 h-3.5 text-blue-600"></i>
                <span class="font-medium text-slate-700">${escapeHtml(tool.author)}</span>
                <span class="text-slate-300">•</span>
                <span class="text-slate-500">${escapeHtml(tool.author_title || '認證律師')}</span>
              </div>

              <p class="text-xs text-slate-600 line-clamp-3 leading-relaxed mb-4">
                ${escapeHtml(tool.description)}
              </p>

              <div class="flex flex-wrap gap-1.5 mb-4">
                ${(tool.tags || []).map(t => `<span class="text-[10px] px-2 py-0.5 rounded bg-slate-100 border border-slate-200 text-slate-600">#${escapeHtml(t)}</span>`).join('')}
              </div>
            </div>

            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
              <button 
                onclick="openReviewModal('${tool.id}')" 
                class="text-xs text-slate-500 hover:text-slate-800 flex items-center space-x-1 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 transition font-medium"
              >
                <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                <span>同行評價</span>
              </button>

              <a 
                href="${tool.url}" 
                class="px-3.5 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold transition flex items-center space-x-1 shadow-sm"
              >
                <span>立即開啟</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          `;
          grid.appendChild(card);
        });

        lucide.createIcons();
    }

    async function openReviewModal(toolId) {
      activeReviewToolId = toolId;
      try {
        const res = await fetch(`/api/tools/${toolId}`);
        if (!res.ok) throw new Error("API Unavailable");
        const data = await res.json();
        renderReviewModalContent(data.tool, data.reviews);
      } catch (err) {
        if (typeof STATIC_DB !== 'undefined') {
          const tool = STATIC_DB.tools.find(t => t.id === toolId) || { name: '工具', description: '', category_name: '' };
          const reviews = STATIC_DB.reviews[toolId] || [];
          renderReviewModalContent(tool, reviews);
        }
      }
    }

    function renderReviewModalContent(tool, reviews) {
      document.getElementById('reviewModalToolName').innerText = tool.name;
      document.getElementById('reviewModalToolDesc').innerText = tool.description;
      document.getElementById('reviewModalCategory').innerText = tool.category_name;

      const list = document.getElementById('reviewsListContainer');
      list.innerHTML = '';
      if (reviews.length === 0) {
        list.innerHTML = '<p class="text-xs text-slate-500">尚無詳細評語，歡迎您發表第一則實務心得！</p>';
      } else {
        reviews.forEach(r => {
          const starText = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
          const item = document.createElement('div');
          item.className = "p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-xs";
          item.innerHTML = `
            <div class="flex items-center justify-between mb-1">
              <span class="font-bold text-slate-800">${escapeHtml(r.author)}</span>
              <span class="text-amber-700 font-serif font-semibold">${starText} (${r.rating}星)</span>
            </div>
            <p class="text-slate-700 leading-relaxed">${escapeHtml(r.content)}</p>
          `;
          list.appendChild(item);
        });
      }

      document.getElementById('reviewModal').classList.remove('hidden');
    }

    function closeReviewModal() {
      document.getElementById('reviewModal').classList.add('hidden');
      activeReviewToolId = null;
    }

    async function handleReviewSubmit(e) {
      e.preventDefault();
      if (!activeReviewToolId) return;

      const payload = {
        author: document.getElementById('reviewerName').value.trim(),
        rating: parseInt(document.getElementById('reviewRating').value),
        content: document.getElementById('reviewContent').value.trim()
      };

      try {
        const res = await fetch(`/api/tools/${activeReviewToolId}/review`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('感謝您為同行提供寶貴之實務評分！已為您重新計算加權排序。');
          closeReviewModal();
          loadTools();
        } else {
          throw new Error('API Unavailable');
        }
      } catch (err) {
        // GitHub Pages 純靜態模式本地模擬
        if (typeof STATIC_DB !== 'undefined') {
          STATIC_DB.reviews[activeReviewToolId] = STATIC_DB.reviews[activeReviewToolId] || [];
          STATIC_DB.reviews[activeReviewToolId].unshift({
            id: 'r-mock-' + Date.now(),
            author: payload.author,
            rating: payload.rating,
            content: payload.content,
            created_at: new Date().toISOString()
          });
          const tool = STATIC_DB.tools.find(t => t.id === activeReviewToolId);
          if (tool) {
            const revs = STATIC_DB.reviews[activeReviewToolId];
            tool.rating = parseFloat((revs.reduce((acc, x) => acc + x.rating, 0) / revs.length).toFixed(2));
            tool.rating_count = revs.length;
          }
          alert('🎉【GitHub Pages 展示模式】已為您完成同行星級評分與心得提交！畫面已即時動態重算評分。');
          closeReviewModal();
          loadTools();
        }
      }
    }

    function openUploadModal() {
      if (currentCategory !== 'all') {
        document.getElementById('toolCategory').value = currentCategory;
      }
      document.getElementById('uploadModal').classList.remove('hidden');
    }
    function closeUploadModal() {
      document.getElementById('uploadModal').classList.add('hidden');
    }

    async function handleUploadSubmit(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('toolName').value.trim(),
        category_id: document.getElementById('toolCategory').value,
        author: document.getElementById('toolAuthor').value.trim(),
        description: document.getElementById('toolDesc').value.trim(),
        tags: document.getElementById('toolTags').value.split(',').map(s => s.trim()).filter(Boolean),
        url: document.getElementById('toolUrl').value.trim() || 'tools.html',
        tool_type: 'web'
      };

      try {
        const res = await fetch('/api/tools', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alert('🎉 恭喜！工具已成功發布至分類市集！');
          closeUploadModal();
          document.getElementById('uploadToolForm').reset();
          loadCategories();
          loadTools();
        } else {
          throw new Error('API Unavailable');
        }
      } catch (err) {
        if (typeof STATIC_DB !== 'undefined') {
          const catMap = {
            'doc-drafting': '文書撰擬與函件格式',
            'privacy-evidence': '案卷隱私與證據處置',
            'timeline-schedule': '程序管轄與時限排程',
            'case-research': '判決檢索與實務爭點',
            'contract-review': '契約審查與法規遵循',
            'cost-calc': '費用試算與執行工具'
          };
          const mockTool = {
            id: 'tool-mock-' + Date.now(),
            name: payload.name,
            category_id: payload.category_id,
            category_name: catMap[payload.category_id] || '自訂工具',
            author: payload.author,
            author_title: '認證律師',
            description: payload.description,
            tags: payload.tags,
            rating: 5.0,
            rating_count: 1,
            url: payload.url,
            is_integrated: false,
            created_at: new Date().toISOString()
          };
          STATIC_DB.tools.unshift(mockTool);
          alert('🎉【GitHub Pages 展示模式】工具已成功發布至當前畫面！');
          closeUploadModal();
          document.getElementById('uploadToolForm').reset();
          loadCategories();
          loadTools();
        }
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
